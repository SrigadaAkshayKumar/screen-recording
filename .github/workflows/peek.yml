name: Read output text

# Read-only: prints text files from Drive output/<project>/ (report.md, notes) into the job summary
# and as annotations, so they can be read without Drive access. Never writes to Drive.
on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Comma-separated project names, e.g. script-14,script-15'
        required: true
      file:
        description: 'File inside output/<project>/'
        default: report.md
        required: true

env:
  DRIVE: gdrive:${{ vars.DRIVE_FOLDER || 'screencast-editor' }}

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure rclone
        env: { RCLONE_CONF: '${{ secrets.RCLONE_CONF }}' }
        run: mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Print files
        env: { PROJECTS: '${{ inputs.projects }}', FILE: '${{ inputs.file }}' }
        run: |
          IFS=',' read -ra ps <<< "$PROJECTS"
          for p in "${ps[@]}"; do
            p=$(echo "$p" | xargs)
            rclone cat "$DRIVE/output/$p/$FILE" > out.txt || { echo "::warning::$p: $FILE not found"; continue; }
            { echo "## $p/$FILE"; cat out.txt; } >> "$GITHUB_STEP_SUMMARY"
            # annotations are capped at ~4 KB each: split into chunks
            split -b 3500 -d out.txt chunk_
            for c in chunk_*; do echo "::notice title=$p $c::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$c")"; done
            rm -f chunk_* out.txt
          done
