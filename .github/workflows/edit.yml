name: Edit screencasts

# Manual: Actions tab -> "Edit screencasts" -> Run workflow.
# Edits EVERYTHING in Google Drive <DRIVE_FOLDER>/inbox (one subfolder per video, or x.mp4 + x.mp3 pairs),
# one after another, and puts the results in <DRIVE_FOLDER>/output/<name>/ (replacing an older output
# of the same name). Nothing is remembered as "done": the inbox is the to-do list. Setup: docs/cloud.md.

on:
  workflow_dispatch:
    inputs:
      projects:
        description: '"all" = everything in the Drive inbox (folders and video+audio pairs), or only some names: script-05,script-06'
        default: all
        required: true
      model:
        description: 'Claude model for the analyze/sync stages (blank = Claude Code default)'
        default: ''
        required: false

permissions:
  contents: write          # the job commits work/*.json back so a re-run of the same inputs reuses them

concurrency:
  group: screencast-edit
  cancel-in-progress: false

env:
  DRIVE: gdrive:${{ vars.DRIVE_FOLDER || 'screencast-editor' }}

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.pick.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Python packages for the inbox listing
        run: pip install -q numpy   # tools/common.py imports numpy
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure rclone
        env: { RCLONE_CONF: '${{ secrets.RCLONE_CONF }}' }
        run: |
          test -n "$RCLONE_CONF" || { echo "::error::secret RCLONE_CONF is missing (see docs/cloud.md)"; exit 1; }
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Create the Drive folders (first run)
        run: rclone mkdir "$DRIVE/inbox" && rclone mkdir "$DRIVE/output"
      - id: pick
        run: |
          list=$(python tools/cloud_run.py list --drive "$DRIVE" --want "${{ inputs.projects }}")
          echo "projects=$list" >> "$GITHUB_OUTPUT"
          names=$(echo "$list" | python -c 'import json,sys; print(", ".join(i["stem"] for i in json.load(sys.stdin)) or "nothing in the inbox")')
          echo "### To edit: $names" >> "$GITHUB_STEP_SUMMARY"

  edit:
    name: ${{ matrix.item.name }}
    needs: list
    if: needs.list.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1        # one after another
      fail-fast: false       # a failed project does not stop the rest
      matrix:
        item: ${{ fromJSON(needs.list.outputs.projects) }}
    env:
      P: ${{ matrix.item.name }}
      VIDEO: ${{ matrix.item.video }}
      AUDIO: ${{ matrix.item.audio }}
      SCRIPT: ${{ matrix.item.script }}
      CLICKS: ${{ matrix.item.clicks }}
      HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: requirements-ci.txt }
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements-ci.txt
      - name: Cache the whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small.en-v1
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure rclone
        env: { RCLONE_CONF: '${{ secrets.RCLONE_CONF }}' }
        run: mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Download inputs from Drive
        run: |
          mkdir -p inbox
          get() { if [ -n "$1" ]; then rclone copyto "$DRIVE/inbox/$1" "inbox/$P.${1##*.}" -v; fi; }
          get "$VIDEO"; get "$AUDIO"; get "$SCRIPT"; get "$CLICKS"
          ls -la inbox

      - name: Export frames (temporary debug)
        run: |
          mkdir -p dbg
          case "$P" in
            script-18) T="0 2 4 4.8 5.5 7 8 10 12 13.2 13.9 14.5 15.2 16 16.7 18" ;;
            script-20) T="266 267.5 269 269.9 270.4 271 272 273 274 275.5 277 278.5 280 281 281.5 281.8 282.3 283 283.8 284.3" ;;
          esac
          for t in $T; do ffmpeg -v error -ss $t -i inbox/$P.mp4 -frames:v 1 -vf "scale=960:-1,drawtext=text='$t':x=10:y=10:fontsize=36:fontcolor=yellow:box=1" dbg/$P-$t.jpg; done
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Describe frames
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "Read every jpg in dbg/ (the yellow number in each is the recording time in seconds). For each frame, in time order, write one line: '<time>: <what the Canva screen shows: which page/panel/dialog is open, what is selected or highlighted, file type dropdown value if visible, where the mouse cursor is and what it hovers>'. Then one line per pair of consecutive frames saying whether anything visible changed. Plain text only, no preamble." --allowedTools Read,Glob > desc.txt || true
          cat desc.txt
          msg=$(python3 -c "import sys;print(open('desc.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
          echo "::notice title=frames-$P::$msg"
